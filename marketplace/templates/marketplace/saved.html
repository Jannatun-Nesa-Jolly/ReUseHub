{% extends 'marketplace/base.html' %}{% block content %}<section class="section-head"><div><p class="eyebrow">YOUR COLLECTION</p><h2>Saved items</h2></div></section><div class="grid">{% for item in listings %}<article class="item-card"><a href="{% url 'detail' item.pk %}">{% if item.image %}<img src="{{ item.image.url }}" alt="{{ item.title }}">{% else %}<div class="placeholder">♻</div>{% endif %}</a><div class="card-body"><h3><a href="{% url 'detail' item.pk %}">{{ item.title }}</a></h3><p>{{ item.category.name }}</p></div></article>{% empty %}<p>You haven't saved any items yet.</p>{% endfor %}</div>{% endblock %}
